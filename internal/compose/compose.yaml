services:
  gateway:
    build: ../gateway
    stop_grace_period: 1s
    volumes:
      - ../gateway/squid.conf:/etc/squid/squid.conf:ro
    networks:
      - public_net
      - private_net

  claude: &cli_tool
    build: &build
      context: .
      dockerfile: common.Dockerfile
      args: &build_args
        CURRENT_HOME: ${CURRENT_HOME:-}
        CURRENT_USERNAME: ${CURRENT_USERNAME:-}
        CURRENT_UID: ${CURRENT_UID:-}
        CURRENT_GID: ${CURRENT_GID:-}
        # override for each cli
        INSTALL_COMMAND: curl -fsSL https://claude.ai/install.sh | bash
    profiles: ["cli"] # prevents auto-start with docker compose up
    networks:
      - private_net
    working_dir: ${PWD}
    environment: &environment
      https_proxy: http://gateway:3128
      http_proxy: http://gateway:3128
    depends_on:
      - gateway
    # override for each cli
    entrypoint: claude

  codex:
    <<: *cli_tool
    build:
      <<: *build
      args:
        <<: *build_args
        INSTALL_COMMAND: npm install -g @openai/codex
    entrypoint: codex

  gemini:
    <<: *cli_tool
    build:
      context: .
      dockerfile: common.Dockerfile
      args:
        <<: *build_args
        INSTALL_COMMAND: npm install -g @google/gemini-cli
    entrypoint: gemini

  cline:
    <<: *cli_tool
    build:
      <<: *build
      args:
        <<: *build_args
        INSTALL_COMMAND: |-
          npm install -g cline
          npm install -g kanban
    entrypoint: cline

  opencode:
    <<: *cli_tool
    build:
      <<: *build
      args:
        <<: *build_args
        INSTALL_COMMAND: curl -fsSL https://opencode.ai/install | bash
    environment:
      <<: *environment
      OPENCODE_OFFLINE: "1"
      OPENCODE_AIRGAPPED: "1"
    entrypoint: ${HOME}/.opencode/bin/opencode

  omp:
    <<: *cli_tool
    build:
      <<: *build
      args:
        <<: *build_args
        INSTALL_COMMAND: curl -fsSL https://omp.sh/install | sh
    entrypoint: omp

  aider:
    <<: *cli_tool
    build:
      context: .
      dockerfile: common.Dockerfile
      args:
        <<: *build_args
        INSTALL_COMMAND: curl -LsSf https://aider.chat/install.sh | sh
    entrypoint: aider

  dsh:
    <<: *cli_tool
    build:
      <<: *build
      args:
        <<: *build_args
        INSTALL_COMMAND: |
          npm install configurable-http-proxy
          npm install @deepseek-ai/dsh
          npm install-scripts approve --all
    entrypoint: npx dsh
    ports:
      - 3080:3080

  goose:
    <<: *cli_tool
    build:
      context: .
      dockerfile: common.Dockerfile
      args:
        <<: *build_args
        INSTALL_COMMAND: curl -fsSL https://github.com/aaif-goose/goose/releases/download/stable/download_cli.sh | CONFIGURE=false bash

  pi:
    <<: *cli_tool
    build:
      <<: *build
      args:
        <<: *build_args
        INSTALL_COMMAND: npm install -g --ignore-scripts @earendil-works/pi-coding-agent
    entrypoint: pi

  prime-agent:
    <<: *cli_tool
    build:
      <<: *build
      args:
        <<: *build_args
        INSTALL_COMMAND: curl -fsSL https://app.primeintellect.ai/prime-agent/install.sh | sh
    entrypoint: prime-agent

  jcode:
    <<: *cli_tool
    build:
      <<: *build
      args:
        <<: *build_args
        INSTALL_COMMAND: curl -fsSL https://jcode.sh/install | bash
    entrypoint: jcode

networks:
  public_net:
    driver: bridge
  private_net:
    internal: true # Air-gap for the CLI tools
